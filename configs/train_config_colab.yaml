# Luhya ASR -- Colab: w2v-bert-2.0
# 10 hours, 2 epochs pour test rapide

project: "Luhya-ASR"
output_dir: "/content/drive/MyDrive/luhya-asr-output"
seed: 42
report_to: "none"

# Model -- Wav2Vec2-BERT 2.0 (580M)
pretrained_model: "w2v-BERT"
freeze_feature_encoder: true
add_final_layer_adapter: true

# Training -- 2 epochs, 10h
batch_size: 4
gradient_accumulation_steps: 8
num_epochs: 2
max_steps: -1
learning_rate: 0.00005
warmup_steps: 500
fp16: true
bf16: false
gradient_checkpointing: true
save_steps: 50
eval_steps: 50
logging_steps: 10
save_total_limit: 1
ctc_zero_infinity: true

# Data -- 10 hours
use_custom_dataset: false
dataset_path: "DDD-Kenya/Luhya-ASR-Data-subset-50h"
train_split: "train"
eval_split: "validation"

max_data_hours: 15
validation_split_pct: 0.2

# Memory safety
max_audio_length: 30.0
num_proc: 2

# Performance
use_torch_compile: false
torch_compile_mode: "reduce-overhead"
group_by_length: true
use_fused_optimizer: false
persistent_workers: true

# ✅ CHANGEMENT ICI
sample: true                    # false → true
sample_size: 3600               # Charge 3600 samples (~15h)

# Text preprocessing
add_language_tokens: false
apply_accent_replacements: false

character_set: " !'*,-.0123456789;:?abcdefghijklmnopqrstuvwxyz"
